<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dart – resultattavla</title>
<style>
  :root {
    --bg: #101413;
    --panel: #1a201e;
    --panel-2: #232b28;
    --line: #2f3a36;
    --text: #eef2ef;
    --muted: #8d9a95;
    --green: #2fa86b;
    --red: #d9443b;
    --gold: #e8b931;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 1.4rem; letter-spacing: .02em; }
  .mode { color: var(--muted); font-size: .95rem; }
  .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--green); margin-right: 6px; vertical-align: middle; }
  .status-dot.offline { background: var(--red); }

  .banner { padding: 14px 18px; border-radius: var(--radius); font-weight: 700; font-size: 1.2rem; text-align: center; }
  .banner.win { background: var(--gold); color: #1d1600; }
  .banner.bust { background: var(--red); }
  .hidden { display: none !important; }

  .players { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
  .player { background: var(--panel); border: 2px solid var(--line); border-radius: var(--radius);
    padding: 14px 16px; display: grid; gap: 6px; transition: border-color .2s, transform .2s; }
  .player.active { border-color: var(--green); transform: translateY(-2px);
    box-shadow: 0 6px 24px rgba(47, 168, 107, .18); }
  .player.winner { border-color: var(--gold); }
  .player .name { font-weight: 600; font-size: 1.05rem; display: flex; justify-content: space-between; gap: 8px; }
  .player .arrow { color: var(--green); }
  .player .remaining { font-size: clamp(2.6rem, 8vw, 4rem); font-weight: 800; line-height: 1;
    font-variant-numeric: tabular-nums; }
  .player .stats { color: var(--muted); font-size: .85rem; display: flex; gap: 12px; flex-wrap: wrap; }
  .player .last { color: var(--muted); font-size: .85rem; min-height: 1.2em; }
  .player .caption { color: var(--muted); font-size: 1.05rem; min-height: 1.2em; letter-spacing: .08em; }
  .player.out { opacity: .4; }
  .player .badge { background: var(--red); color: #fff; border-radius: 6px; padding: 0 6px; font-size: .75rem; font-weight: 700; }
  .marks { display: flex; gap: 4px; flex-wrap: wrap; }
  .mark { background: var(--panel-2); border-radius: 6px; padding: 2px 6px; font-size: .8rem;
    font-variant-numeric: tabular-nums; min-width: 44px; text-align: center; }
  .mark b { margin-left: 4px; }
  .mark.closed { background: var(--green); color: #04150c; }
  .banner.note { background: var(--panel-2); }
  .numbers button.target { box-shadow: inset 0 0 0 2px var(--gold); }
  dialog .desc { color: var(--muted); font-size: .85rem; margin: -6px 0 14px; }

  .turn { background: var(--panel); border-radius: var(--radius); padding: 14px 16px;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .turn .who { font-weight: 600; min-width: 120px; }
  .darts { display: flex; gap: 8px; }
  .dart { width: 72px; height: 52px; border-radius: 10px; background: var(--panel-2);
    border: 1px dashed var(--line); display: grid; place-items: center; font-weight: 700; font-size: 1.1rem; }
  .dart.filled { border-style: solid; border-color: var(--green); cursor: pointer; }
  .dart.filled:hover { filter: brightness(1.25); }
  .dart.fixed { border-color: var(--gold); color: var(--gold); }
  .dart.editing { outline: 3px solid var(--gold); outline-offset: 2px; }
  .hint { color: var(--muted); font-size: .8rem; width: 100%; }
  .pad.correcting { outline: 2px solid var(--gold); }
  .pad.correcting h2 { color: var(--gold); }
  .turn .sum { margin-left: auto; font-size: 1.6rem; font-weight: 800; font-variant-numeric: tabular-nums; }

  .pad { background: var(--panel); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 12px; }
  .pad h2 { margin: 0; font-size: 1rem; color: var(--muted); font-weight: 600; }
  .mult { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .mult button { padding: 10px; border-radius: 10px; background: var(--panel-2); font-weight: 700; }
  .mult button.on { background: var(--green); }
  .mult button[data-m="3"].on { background: var(--red); }
  .numbers { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 8px; }
  .numbers button { padding: 14px 0; border-radius: 10px; background: var(--panel-2); font-weight: 700;
    font-size: 1.1rem; font-variant-numeric: tabular-nums; }
  .numbers button:hover, .mult button:hover, .actions button:hover { filter: brightness(1.2); }
  .numbers button:disabled { opacity: .3; cursor: not-allowed; }
  .numbers .miss { background: #3a2a29; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .actions button { padding: 10px 16px; border-radius: 10px; background: var(--panel-2); font-weight: 600; }
  .actions .primary { background: var(--green); }
  .error { color: var(--red); min-height: 1.2em; font-size: .9rem; }

  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 20px; width: min(420px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(0, 0, 0, .6); }
  dialog h2 { margin-top: 0; }
  dialog label { display: grid; gap: 6px; margin-bottom: 14px; font-size: .9rem; color: var(--muted); }
  dialog textarea, dialog select { font: inherit; color: var(--text); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  dialog .check { display: flex; align-items: center; gap: 8px; color: var(--text); }
  dialog .row { display: flex; gap: 8px; justify-content: flex-end; }
  dialog .row button { padding: 10px 16px; border-radius: 10px; background: var(--panel-2); font-weight: 600; }
  dialog .row button.primary { background: var(--green); }
  dialog .row button:hover { filter: brightness(1.2); }

  @media (max-width: 520px) {
    .dart { width: 60px; }
    .turn .sum { margin-left: 0; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>🎯 Dart</h1>
      <div class="mode"><span id="dot" class="status-dot"></span><span id="mode">Ansluter…</span></div>
    </div>
    <div class="actions">
      <button id="newGameBtn" class="primary">Nytt spel</button>
    </div>
  </header>

  <div id="banner" class="banner hidden"></div>

  <section id="players" class="players"></section>

  <section class="turn">
    <div class="who" id="turnWho"></div>
    <div class="darts" id="turnDarts"></div>
    <div class="sum" id="turnSum"></div>
    <div class="hint">Fel värde? Klicka på pilen och välj rätt värde nedan.</div>
  </section>

  <section class="pad" id="pad">
    <h2 id="padTitle">Mata in pil manuellt</h2>
    <div class="mult" id="mult">
      <button data-m="1" class="on">Singel</button>
      <button data-m="2">Dubbel</button>
      <button data-m="3">Trippel</button>
    </div>
    <div class="numbers" id="numbers"></div>
    <div class="actions">
      <button id="nextBtn">Nästa spelare ⏭</button>
      <button id="undoBtn">Ångra ↶</button>
      <button id="cancelFixBtn" class="hidden">Avbryt rättning</button>
    </div>
    <div class="error" id="error"></div>
  </section>
</main>

<dialog id="newGameDialog">
  <form method="dialog" id="newGameForm">
    <h2>Nytt spel</h2>
    <label>Deltagare (en per rad)
      <textarea id="playersInput" rows="4"></textarea>
    </label>
    <label>Spel
      <select id="gameKind">
        <option value="x01">X01 (501, 301 …)</option>
        <option value="cricket">Cricket</option>
        <option value="killer">Killer</option>
        <option value="shanghai">Shanghai</option>
        <option value="around_the_clock">Around the Clock</option>
      </select>
    </label>
    <p class="desc" id="gameDesc"></p>
    <label data-for="x01">Startpoäng
      <select id="startScore">
        <option value="501">501</option>
        <option value="301">301</option>
        <option value="701">701</option>
        <option value="101">101</option>
      </select>
    </label>
    <label class="check" data-for="x01"><input type="checkbox" id="doubleOut" checked> Avsluta på dubbel (double out)</label>
    <label data-for="killer">Liv
      <select id="lives">
        <option value="3">3</option>
        <option value="5">5</option>
      </select>
    </label>
    <div class="row">
      <button type="button" class="cancel" id="cancelBtn">Avbryt</button>
      <button type="submit" class="primary">Starta</button>
    </div>
  </form>
</dialog>

<script>
  let state = null;
  let multiplier = 1;
  let correcting = null;  // {index, key} while a dart of the turn is being corrected
  const $ = id => document.getElementById(id);

  async function api(path, body) {
    const opts = body === undefined ? {} : {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    };
    const res = await fetch(path, opts);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    return data;
  }

  async function act(path, body = {}) {
    $("error").textContent = "";
    try {
      render(await api(path, body));
    } catch (e) {
      $("error").textContent = e.message;
    }
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  const MARK_SYMBOLS = ["", "/", "✕", "Ⓧ"];

  function render(s) {
    state = s;
    $("mode").textContent = s.title;
    const finished = s.winners.length > 0;

    const box = $("players");
    box.replaceChildren();
    s.players.forEach((p, i) => {
      const card = el("div", "player");
      if (!finished && i === s.current) card.classList.add("active");
      if (s.winners.includes(i)) card.classList.add("winner");
      if (p.out) card.classList.add("out");
      const name = el("div", "name");
      name.append(el("span", "", p.name));
      if (s.winners.includes(i)) name.append(el("span", "", "🏆"));
      else if (!finished && i === s.current) name.append(el("span", "arrow", "● kastar"));
      else if (p.killer) name.append(el("span", "badge", "KILLER"));
      card.append(name, el("div", "remaining", p.big));
      if (p.caption) card.append(el("div", "caption", p.caption));
      if (p.marks) {
        const marks = el("div", "marks");
        p.marks.forEach(m => {
          const chip = el("span", m.marks >= 3 ? "mark closed" : "mark", m.label);
          chip.append(el("b", "", MARK_SYMBOLS[Math.min(m.marks, 3)]));
          marks.append(chip);
        });
        card.append(marks);
      }
      const stats = el("div", "stats");
      p.stats.forEach(t => stats.append(el("span", "", t)));
      card.append(stats, el("div", "last", p.last_turn.length ? `Senast: ${p.last_turn.join(" · ")}` : ""));
      box.append(card);
    });

    const banner = $("banner");
    if (finished) {
      banner.className = "banner win";
      const names = s.winners.map(i => s.players[i].name).join(" och ");
      banner.textContent = `🏆 ${names} ${s.winners.length > 1 ? "delar segern" : "vinner"}!`
        + (s.message ? ` – ${s.message}` : "");
    } else if (s.message) {
      banner.className = s.bust ? "banner bust" : "banner note";
      banner.textContent = s.message;
    } else {
      banner.className = "banner hidden";
    }

    const who = finished ? s.winners[0] : s.current;
    $("turnWho").textContent = s.turn_over && !finished
      ? `Tur klar: ${s.players[who].name}`
      : s.players[who].name;
    if (correcting && (correcting.key !== turnKey(s) || !s.turn[correcting.index])) correcting = null;
    const darts = $("turnDarts");
    darts.replaceChildren();
    for (let i = 0; i < 3; i++) {
      const d = s.turn[i];
      const box = el(d ? "button" : "div", d ? "dart filled" : "dart", d ? d.label : "");
      if (d) {
        if (d.corrected) box.classList.add("fixed");
        if (correcting && correcting.index === i) box.classList.add("editing");
        box.title = "Rätta den här pilen";
        box.onclick = () => startCorrecting(i);
      }
      darts.append(box);
    }
    updatePadMode();
    $("turnSum").textContent = s.turn_summary;

    const over = finished && correcting === null;
    document.querySelectorAll("#numbers button").forEach(b => {
      b.disabled = over;
      b.classList.toggle("target", !correcting && s.highlight.includes(Number(b.dataset.seg)));
    });
    $("nextBtn").disabled = over;
    $("undoBtn").disabled = !s.can_undo;
    updateBullButton();
  }

  function turnKey(s) {
    return `${s.current}|${s.turn.length}|${s.players[s.current].darts_thrown}`;
  }

  function startCorrecting(index) {
    if (!state || !state.turn[index]) return;
    correcting = correcting && correcting.index === index ? null : { index, key: turnKey(state) };
    setMultiplier(1);
    render(state);
  }

  function updatePadMode() {
    const on = correcting !== null;
    $("pad").classList.toggle("correcting", on);
    $("padTitle").textContent = on
      ? `Rätta pil ${correcting.index + 1} (${state.turn[correcting.index].label}) – välj rätt värde`
      : "Mata in pil manuellt";
    $("cancelFixBtn").classList.toggle("hidden", !on);
  }

  function updateBullButton() {
    const bull = document.querySelector("#numbers [data-seg='25']");
    if (!bull) return;
    bull.disabled = multiplier === 3 || (state && state.winners.length > 0 && correcting === null);
    bull.textContent = multiplier === 2 ? "Bull" : "25";
  }

  function buildPad() {
    const nums = $("numbers");
    for (let n = 1; n <= 20; n++) {
      const b = el("button", "", n);
      b.dataset.seg = n;
      nums.append(b);
    }
    const bull = el("button", "", "25");
    bull.dataset.seg = 25;
    const miss = el("button", "miss", "Miss");
    miss.dataset.seg = 0;
    nums.append(bull, miss);

    nums.addEventListener("click", e => {
      const b = e.target.closest("button");
      if (!b || b.disabled) return;
      const seg = Number(b.dataset.seg);
      const value = { segment: seg, multiplier: seg === 0 ? 0 : multiplier };
      if (correcting) {
        const index = correcting.index;
        correcting = null;
        act("/api/correct", { index, ...value });
      } else {
        act("/api/throw", value);
      }
      setMultiplier(1);
    });

    $("mult").addEventListener("click", e => {
      const b = e.target.closest("button");
      if (b) setMultiplier(Number(b.dataset.m));
    });
  }

  function setMultiplier(m) {
    multiplier = m;
    document.querySelectorAll("#mult button").forEach(b =>
      b.classList.toggle("on", Number(b.dataset.m) === m));
    updateBullButton();
  }

  $("cancelFixBtn").onclick = () => { correcting = null; render(state); };
  $("nextBtn").onclick = () => act("/api/next");
  $("undoBtn").onclick = () => act("/api/undo");
  const GAME_DESCRIPTIONS = {
    x01: "Räkna ner till exakt 0.",
    cricket: "Stäng 20–15 och bull med tre märken var. Extra märken på stängda nummer ger poäng så länge någon motståndare har numret öppet.",
    killer: "Alla får ett slumpat nummer. Träffa ditt nummer för att bli killer, och ta sedan liv från de andra genom att träffa deras nummer (singel 1, dubbel 2, trippel 3). Träffar en killer sitt eget nummer förlorar den liv. Sist kvar vinner.",
    shanghai: "Sju rundor, i runda N räknas bara N. Singel, dubbel och trippel i samma tur (Shanghai) vinner direkt.",
    around_the_clock: "Träffa 1, 2, 3 … 20 och sist bull, i ordning. Först runt vinner.",
  };

  function updateGameOptions() {
    const kind = $("gameKind").value;
    $("gameDesc").textContent = GAME_DESCRIPTIONS[kind];
    document.querySelectorAll("#newGameForm [data-for]").forEach(e =>
      e.classList.toggle("hidden", e.dataset.for !== kind));
  }
  $("gameKind").onchange = updateGameOptions;

  $("newGameBtn").onclick = () => {
    if (state) {
      $("playersInput").value = state.players.map(p => p.name).join("\n");
      $("gameKind").value = state.game;
      if (state.game === "x01") {
        $("startScore").value = String(state.start_score);
        $("doubleOut").checked = state.double_out;
      }
    }
    updateGameOptions();
    $("newGameDialog").showModal();
  };
  $("cancelBtn").onclick = () => $("newGameDialog").close();
  $("newGameForm").onsubmit = () => {
    const players = $("playersInput").value.split("\n").map(s => s.trim()).filter(Boolean);
    act("/api/new-game", {
      game: $("gameKind").value,
      players,
      start_score: Number($("startScore").value),
      double_out: $("doubleOut").checked,
      lives: Number($("lives").value),
    });
  };

  async function poll() {
    try {
      const s = await api("/api/state");
      $("dot").classList.remove("offline");
      if (JSON.stringify(s) !== JSON.stringify(state)) render(s);
    } catch {
      $("dot").classList.add("offline");
      $("mode").textContent = "Ingen kontakt med servern";
    }
  }

  buildPad();
  poll();
  setInterval(poll, 1000);
</script>
</body>
</html>
